name: Generate visual asset batch

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Procedural Blender asset batch
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - premium-pilot
          - enemies
          - bosses
          - characters
          - world-tree
          - equipment
          - arena
          - environment
          - ui
          - ui-supplement
          - skill-icons
          - ceremony
          - vfx
          - projectile
          - equipment-overlay
          - all

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HERO_TOOLS_ROOT: /tmp/hero-defense-tools

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install transient headless-render libraries
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends
          libxkbcommon0 libgl1-mesa-dri libegl1 xvfb xauth

      - name: Install checksum-pinned Blender outside repository
        id: blender
        run: |
          path=$(./scripts/install-blender-temp.sh | tail -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Render requested batch headlessly
        run: >-
          xvfb-run -a -s "-screen 0 640x480x24"
          "${{ steps.blender.outputs.path }}"
          --background
          --factory-startup
          --python tools/blender/generate_assets.py
          --
          --batch "${{ inputs.batch }}"
          --output /tmp/hero-defense-rendered

      # A master render is not the shipped tier. Blender now renders premium characters onto 384 px frames at
      # 3x/32 while the reviewed runtime tier is 192 px at 2x/28, exactly half and on the same grid, so the batch
      # that ships is the *published* tier. This step is exactly the LOD the promotion tools consume; the
      # publisher refuses geometry it cannot halve or a master grid that disagrees with the reviewed one, so a
      # batch that cannot become the reviewed tier fails here rather than at promotion time. (Batches whose class
      # has no published tier definition yet -- bosses, the world tree -- are refused by the same tool.)
      - name: Publish the reviewed runtime tier of the rendered batch
        run: >-
          python3 tools/visual/publish_runtime_tier.py
          /tmp/hero-defense-rendered
          /tmp/hero-defense-runtime
          --reviewed-manifest android/assets/generated/asset_manifest.json

      # Validated against the tier that ships, not against the master render: the R3.4 batch failed this step
      # for a real reason (masters are 3x/32, the reviewed tier is 2x/28) and the fix was to validate the thing
      # that is actually promoted. The ledger gate recognises a candidate batch and skips its exact-hash half.
      - name: Validate frame, pivot, alpha, page, and decoded-memory contracts
        run: python3 tools/visual/validate_generated_assets.py /tmp/hero-defense-runtime

      # The budget applies to the reviewable payload: sheets, atlases, per-asset metadata, manifest. The
      # working frames under _frames/ are intermediates (every frame they contain is in the packed sheet at
      # 1x, and their alpha/pivot contracts are validated by the step above), and with the doubled R3.4
      # roster they would have eaten most of the 100 MB artifact cap for no review value.
      - name: Enforce generated-artifact size budget
        run: |
          size=$(du -sb --exclude=_frames /tmp/hero-defense-rendered | cut -f1)
          test "$size" -lt 100000000
          echo "Reviewable payload bytes (working frames excluded): $size"

      # A failed validation must not throw away the render that produced it: the R3.4 render was lost this
      # way once (the ledger gate rejected a partial batch after ~35 minutes of rendering), and the only way
      # to look at the failure was to render again. The job still fails; the artifact is just evidence.
      - name: Upload reviewable render batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-defense-${{ inputs.batch }}-sprites
          path: |
            /tmp/hero-defense-rendered/
            /tmp/hero-defense-runtime/
            !/tmp/hero-defense-rendered/_frames/
          if-no-files-found: error
          retention-days: 14
