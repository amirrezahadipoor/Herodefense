name: Device evidence — multi-profile + real-device notes (I2)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/src/androidTest/**"
      - "docs/device_evidence/**"
      - "core/src/main/java/**/render/**"
      - "core/src/main/java/**/presentation/**"
      - ".github/workflows/device-evidence.yml"

permissions:
  contents: read

concurrency:
  group: device-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            profile: pixel_3a
            name: "legacy mid-range"
          - api: 33
            profile: pixel_7
            name: "modern flagship"
          - api: 34
            profile: pixel_tablet
            name: "tablet large-screen"
          # pixel_fold is not a device id this SDK ships ("No device found matching --device
          # pixel_fold", run 35462188576), so the foldable profile is resolved at run time from
          # whatever foldable device definitions avdmanager actually lists.
          - api: 34
            profile: fold
            name: "foldable continuity"
            foldable: true
    env:
      GRADLE_USER_HOME: /tmp/herodefense-gradle
      HERO_PROJECT_CACHE_DIR: /tmp/herodefense-project-cache
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: ./scripts/gradle.sh :android:assembleDebug --stacktrace

      - name: Resolve the foldable device id this SDK ships
        if: matrix.foldable == true
        id: fold
        run: |
          avdmanager_bin=""
          for candidate in "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/avdmanager; do
            if [ -x "$candidate" ]; then avdmanager_bin="$candidate"; break; fi
          done
          if [ -z "$avdmanager_bin" ]; then
            echo "::error::avdmanager was not found under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi
          # This SDK ships only a legacy foldable entry, whose id line reads `59 or "6.7in Foldable"`:
          # the quoted name is the form avdmanager accepts as --device, so it is extracted; a modern
          # id (a clean identifier like pixel_9_pro_fold) is used as it stands.
          fold=$("$avdmanager_bin" list device | awk -F': *' 'tolower($1)=="id" && tolower($2) ~ /fold/ {print $2; exit}')
          if [ -z "$fold" ]; then
            echo "::error::no foldable device profile in this SDK's device list -- the foldable continuity profile needs one to run" >&2
            exit 1
          fi
          case "$fold" in
            *[!a-zA-Z0-9_]*)
              fold=$(printf '%s' "$fold" | sed 's/.*"\(.*\)".*/\1/')
              echo "legacy foldable device entry resolved to: $fold"
              ;;
            *) echo "resolved foldable device id: $fold" ;;
          esac
          if [ -z "$fold" ]; then
            echo "::error::the foldable device entry could not be resolved to a usable id" >&2
            exit 1
          fi
          echo "id=$fold" >> "$GITHUB_OUTPUT"

      - name: Run device info + smoke on ${{ matrix.profile }} API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.foldable && steps.fold.outputs.id || matrix.profile }}
          target: ${{ matrix.foldable && 'google_apis' || 'default' }}
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          # The emulator-runner runs each line as its own sh -c and stops at the first failing line,
          # so every command here is single-line and the pull guards itself: a real failure in the
          # smoke run or the capture test fails the step, and only the evidence pulls are best-effort.
          script: |
            adb shell getprop > device-props-${{ matrix.profile }}-api${{ matrix.api }}.txt
            adb shell dumpsys display > dumpsys-display-${{ matrix.profile }}-api${{ matrix.api }}.txt
            ./scripts/android-touch-test.sh
            # am instrument rather than a second gradle pass: connectedDebugAndroidTest uninstalls
            # both APKs when it finishes, and the uninstall deletes the evidence file with them.
            adb install -r -t android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb shell am instrument -w -e class com.amirrezahadipoor.herodefense.android.DeviceInfoCaptureTest com.amirrezahadipoor.herodefense.debug.test/androidx.test.runner.AndroidJUnitRunner
            if adb pull /sdcard/Android/data/com.amirrezahadipoor.herodefense.debug/files/device-info.txt device-info-${{ matrix.profile }}-api${{ matrix.api }}.txt; then echo "device-info.txt pulled from the debug package"; elif adb shell run-as com.amirrezahadipoor.herodefense.debug cat /sdcard/Android/data/com.amirrezahadipoor.herodefense.debug/files/device-info.txt > device-info-${{ matrix.profile }}-api${{ matrix.api }}.txt; then echo "device-info.txt read as the app: API 30 denies the shell a direct pull"; else echo "device-info.txt was not readable on the device"; fi

      - name: Upload device evidence ${{ matrix.profile }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-evidence-${{ matrix.profile }}-api${{ matrix.api }}-${{ github.sha }}
          path: |
            device-*.txt
            dumpsys-*.txt
            android/build/reports/androidTests/
            android/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 30

  summarize:
    runs-on: ubuntu-latest
    needs: device-matrix
    if: always()
    steps:
      - name: Summarize I2
        run: |
          {
            echo "### I2 — Device Evidence"
            echo
            echo "This run executed the game on 4 profiles (pixel_3a API30, pixel_7 API33, tablet API34, fold API34)."
            echo "Each artifact contains:"
            echo "- getprop (model, manufacturer, ABI)"
            echo "- dumpsys display (density, size)"
            echo "- device-info.txt from DeviceInfoCaptureTest (Build, DisplayMetrics, Configuration)"
            echo "- 30 frames from AndroidTouchSmokeTest"
            echo
            echo "Real-device spot checks are recorded in docs/human_reviews/ and docs/device_evidence/DEVICE_EVIDENCE.md"
            echo "Limitations (x86_64 vs ARM, SwiftShader vs Adreno/Mali) are documented in DEVICE_EVIDENCE.md"
          } | tee -a "$GITHUB_STEP_SUMMARY"
