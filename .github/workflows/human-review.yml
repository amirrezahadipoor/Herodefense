name: Human visual review — capture running game

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "android/assets/generated/**"
      - "core/src/main/java/**/render/**"
      - "docs/human_reviews/**"
      - "docs/device_evidence/**"

permissions:
  contents: read

concurrency:
  group: human-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-for-human-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_USER_HOME: /tmp/herodefense-gradle
      HERO_PROJECT_CACHE_DIR: /tmp/herodefense-project-cache
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK for review
        run: ./scripts/gradle.sh :android:assembleDebug --stacktrace

      - name: Run touch smoke test — 30 frames for human eyes (E3) + device info (I2)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            # The emulator-runner runs each line as its own sh -c and stops at the first failing line,
            # so every command here is single-line and the pull guards itself: a real failure in the
            # smoke run or the capture test fails the step, and only the evidence pull is best-effort.
            adb shell getprop > device-props.txt
            adb shell dumpsys display > dumpsys-display.txt
            ./scripts/android-touch-test.sh
            ./gradlew :android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.amirrezahadipoor.herodefense.android.DeviceInfoCaptureTest --stacktrace
            if adb pull /sdcard/Android/data/com.amirrezahadipoor.herodefense.debug/files/device-info.txt device-info.txt; then echo "device-info.txt pulled from the debug package"; else echo "device-info.txt was not on the device: the capture test did not reach its write"; fi
      - name: Upload human-review frames (E3 — what a machine cannot catch) + device info (I2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-frames-${{ github.sha }}
          path: |
            android/build/reports/androidTests/
            android/build/reports/androidTests/diagnostics/
            device-*.txt
            dumpsys-*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize for reviewer
        if: always()
        run: |
          {
            echo "### Human Review — E3 + I2 Device Evidence"
            echo
            echo "This run captured 30 frames of the running game via AndroidTouchSmokeTest."
            echo "Device info (I2) captured via getprop, dumpsys, and DeviceInfoCaptureTest."
            echo "A human must open the artifact 'human-review-frames' and check:"
            echo "- No subtitle collides with tap hint (G5a)"
            echo "- No text overflows at arm's length (E4)"
            echo "- HUD mirrors in RTL (G4)"
            echo "- Second arena distinct (D1) and 8 boss identities readable (D3)"
            echo "- Walk bob (E2) does not obscure feet"
            echo "- Device evidence beyond x86 emulator (I2) — see docs/device_evidence/DEVICE_EVIDENCE.md"
            echo
            echo "Record findings in docs/human_reviews/REVIEW_YYYY-MM-DD.md"
            echo "Evidence: HumanReviewRecordTest guards existence of review file."
          } | tee -a "$GITHUB_STEP_SUMMARY"
